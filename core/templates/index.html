{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="{% static "css/styles.css" %}">
  <title>Django 1 - Index</title>
</head>
<body>

  <center>
    <h1>Index</h1>

  <img src="{% static "images/django1.gif" %}" alt="Logo">

  <h2>{{ curso }}</h2>
  <h3>{{ outro }}</h3>

  <table>
    <thead>
      <tr>
        <th>Produto</th>
        <th>Preço</th>
      </tr>
    </thead>
    <tbody>
      {% for p in produtos %}
      <tr>
        <td><a href="{% url 'produto' p.id %}">{{ p.nome }}</a></td>
        <td>{{ p.preco }}</td>
      </tr>
      {% endfor %}
    </tbody>
  </table>

  <button onclick="teste();">Salvar</button>
  </center>

  <script type="text/javascript" src="{% static "js/script.js" %}"></script>
</body>
</html>
